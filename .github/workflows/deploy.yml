name: Deploy PodLens to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: podlens-511817
  REGION: us-central1
  SERVICE_NAME: podlens
  IMAGE_NAME: us-central1-docker.pkg.dev/podlens-511817/podlens-repo/podlens

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Option A: Authenticate using Service Account Key JSON
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: |
          echo "Configuring docker authentication..."
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Container Image
        run: |
          echo "Building multi-stage container locally on GitHub Actions runner..."
          docker build \
            -t "${IMAGE_NAME}:${{ github.sha }}" \
            -t "${IMAGE_NAME}:latest" .

      - name: Push Container Image to Artifact Registry
        run: |
          echo "Pushing container image to Artifact Registry..."
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"

      - name: Deploy to Cloud Run
        run: |
          echo "Deploying new revision to Cloud Run..."
          if ! gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE_NAME}:${{ github.sha }}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --cpu-boost \
            --timeout=300 \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},GCP_LOCATION=${REGION},GEMINI_MODEL=gemini-1.5-flash-001,FIRESTORE_DATABASE=(default),DEMO_MODE=true,PYTHONUNBUFFERED=1"; then
              echo "================================================================"
              echo "!!! CLOUD RUN DEPLOYMENT FAILED - FETCHING REVISION LOGS !!!"
              echo "================================================================"
              gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="podlens"' --project="${PROJECT_ID}" --limit=100 --format="table(timestamp,severity,textPayload,jsonPayload.message)"
              exit 1
          fi

